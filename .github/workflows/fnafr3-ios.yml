name: FNAFR 3 v12 - locate actual GameMaker parser crash

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    name: Build debug Butterscotch and locate BinaryReader failure
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Get FNAFR 3 APK from THIS repo Releases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input game report
          APK=""
          while IFS= read -r TAG; do
            [ -n "$TAG" ] || continue
            DIR="input/$(echo "$TAG" | tr '/ ' '__')"
            mkdir -p "$DIR"
            gh release download "$TAG" -p '*.apk' -D "$DIR" 2>/dev/null || true
            APK="$(find "$DIR" -type f -iname '*.apk' | grep -Ei 'frickbear|fnafr' | head -1 || true)"
            [ -n "$APK" ] && break
          done < <(gh release list --limit 30 --json tagName --jq '.[].tagName')
          [ -n "$APK" ] && [ -s "$APK" ] || {
            echo 'ERROR: Original Frickbear APK not found in this repo Releases.' >&2
            exit 1
          }
          unzip -p "$APK" assets/game.droid > game/game.droid
          test -s game/game.droid
          echo "source=$APK" > report/source.txt
          sha256sum game/game.droid | tee report/game-droid-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path('game/game.droid').read_bytes()
          assert b[:4] == b'FORM'
          assert len(b) == 8 + struct.unpack_from('<I', b, 4)[0]
          assert b[17] == 17, f'Expected WAD17, got {b[17]}'
          print('Valid outer FORM, GameMaker WAD17, bytes:',len(b))
          PY

      - name: Install debugger and C build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git cmake ninja-build build-essential pkg-config gdb xvfb \
            libsdl2-dev libgl1-mesa-dev libx11-dev libasound2-dev \
            libpulse-dev libsamplerate0-dev file

      - name: Clone and compile DEBUG Butterscotch from source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recurse-submodules \
            https://github.com/ButterscotchRunner/Butterscotch.git src/Butterscotch
          git -C src/Butterscotch rev-parse HEAD | tee report/butterscotch-commit.txt
          # Real debug symbols, ASAN off: GDB must stop at the precise bad read.
          cmake -S src/Butterscotch -B debug-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS_DEBUG='-O0 -g3 -fno-omit-frame-pointer' \
            -DPLATFORM=cli \
            -DBACKEND=sdl2 \
            -DAUDIO_BACKEND=miniaudio \
            -DENABLE_WAD17=ON \
            -DENABLE_ASAN=OFF \
            -DENABLE_VM_STUB_LOGS=ON \
            2>&1 | tee report/cmake-configure.log
          cmake --build debug-build -j 4 2>&1 | tee report/debug-build.log
          test -x debug-build/butterscotch
          file debug-build/butterscotch | tee report/debug-binary.txt

      - name: GDB backtrace at FIRST invalid BinaryReader access
        shell: bash
        run: |
          set -uo pipefail
          ulimit -c 0 || true
          # The v11 test showed an abort during --print-rooms. Running the
          # DEBUG source build with GDB should reveal the parser function.
          xvfb-run -a timeout 180s gdb -q -batch \
            -ex 'set pagination off' \
            -ex 'set print pretty on' \
            -ex 'set print elements 40' \
            -ex 'handle SIGABRT stop print nopass' \
            -ex 'handle SIGSEGV stop print nopass' \
            -ex 'run' \
            -ex 'bt full 40' \
            -ex 'info registers' \
            -ex 'thread apply all bt 15' \
            --args "$PWD/debug-build/butterscotch" \
            --print-rooms "$PWD/game/game.droid" \
            > report/gdb-full.txt 2>&1
          RC=$?
          echo "$RC" > report/gdb-exit.txt
          grep -E '^#([0-9]+|\s)|BinaryReader|buffer read error|signal SIG' \
            report/gdb-full.txt | head -130 > report/KEY-STACK-FRAMES.txt || true
          if grep -q 'BinaryReader: buffer read error' report/gdb-full.txt; then
            echo 'REPRODUCED: precise source-code stack in gdb-full.txt' \
              | tee report/CONCLUSION.txt
          else
            echo 'Check GDB full output: error may be build-specific or happen earlier.' \
              | tee report/CONCLUSION.txt
          fi
          cat report/KEY-STACK-FRAMES.txt || true
          # This job records data; a positive run is NOT a fixed runner or IPA.
          exit 0

      - name: Upload report (send this ZIP to ChatGPT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FNAFR-3-v12-Actual-Parser-Backtrace
          path: report/
          if-no-files-found: warn
          retention-days: 14
