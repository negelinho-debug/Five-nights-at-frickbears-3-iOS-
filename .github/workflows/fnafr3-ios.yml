name: FNAFR 3 Mobile 1.4.5 iOS - CLEAN PORT v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Frickbear's 3 Mobile 1.4.5 iOS
    runs-on: macos-14
    timeout-minutes: 90

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja sdl2 pkg-config || true
          python3 -m venv "$RUNNER_TEMP/fnafr145-venv"
          source "$RUNNER_TEMP/fnafr145-venv/bin/activate"
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyyaml
          rm -rf work output Payload
          mkdir -p work/release output

      - name: Download Frickbear's 3 Mobile 1.4.5 APK from Releases
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/fnafr145-venv/bin/activate"

          python3 - <<'PYAPK'
          import json
          import os
          import pathlib
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          releases = json.loads(
              subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/releases?per_page=100"],
                  text=True,
              )
          )

          matches = []
          for release in releases:
              for asset in release.get("assets", []):
                  name = asset.get("name", "")
                  lower = name.lower()
                  if lower.endswith(".apk") and "1.4.5" in lower:
                      score = 0
                      if "frick" in lower:
                          score += 10
                      if "fnafr" in lower:
                          score += 5
                      if "mobile" in lower:
                          score += 2
                      matches.append((score, release, asset))

          if not matches:
              print("===== RELEASE ASSETS =====")
              for release in releases:
                  for asset in release.get("assets", []):
                      print(release.get("tag_name"), "->", asset.get("name"))
              raise SystemExit(
                  "ERROR: no APK containing 1.4.5 was found in GitHub Releases"
              )

          matches.sort(key=lambda x: x[0], reverse=True)
          _, release, asset = matches[0]

          print("Using release:", release.get("tag_name"))
          print("Using asset:", asset.get("name"))
          print("Asset bytes:", asset.get("size"))

          out = pathlib.Path("work/release/FNAFR3-1.4.5.apk")
          endpoint = (
              f"repos/{repo}/releases/assets/{asset['id']}"
          )

          with out.open("wb") as fp:
              subprocess.run(
                  [
                      "gh", "api", endpoint,
                      "-H", "Accept: application/octet-stream",
                  ],
                  stdout=fp,
                  check=True,
              )

          if out.stat().st_size < 1024 * 1024:
              raise SystemExit("ERROR: downloaded APK is too small")

          print("Downloaded:", out, out.stat().st_size, "bytes")
          PYAPK

          cp work/release/FNAFR3-1.4.5.apk work/FNAFR3.apk
          ls -lh work/FNAFR3.apk

      - name: Extract and verify exact 1.4.5 game data
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/apk
          mkdir -p work/apk
          unzip -oq work/FNAFR3.apk -d work/apk

          test -f work/apk/assets/game.droid

          GAME_SHA="$(shasum -a 256 work/apk/assets/game.droid | awk '{print $1}')"
          EXPECTED_GAME_SHA="7f800beeb260f1052343065e448755e3eb253c762698f3889de136af8e2537a2"

          echo "game.droid SHA256: $GAME_SHA"
          ls -lh work/apk/assets/game.droid

          if [ "$GAME_SHA" != "$EXPECTED_GAME_SHA" ]; then
            echo "ERROR: this APK is not the same 1.4.5 Betatest build we checked."
            exit 1
          fi

          python3 - <<'PYDATA'
          from pathlib import Path
          import struct

          p = Path("work/apk/assets/game.droid")
          b = p.read_bytes()

          if not b.startswith(b"FORM") or b[8:12] != b"GEN8":
              raise SystemExit("ERROR: game.droid is not expected GameMaker FORM/GEN8")

          tgin = b.find(b"TGIN")
          if tgin < 0:
              raise SystemExit("ERROR: TGIN chunk not found")

          pos = tgin + 8
          version = struct.unpack_from("<I", b, pos)[0]
          count = struct.unpack_from("<I", b, pos + 4)[0]

          print("FORM/GEN8 OK")
          print("TGIN version:", version)
          print("Texture groups:", count)
          print("game.droid bytes:", len(b))
          PYDATA

          echo "yytex files: $(find work/apk/assets -type f -name '*.yytex' | wc -l | tr -d ' ')"

      - name: Find original launcher icon
        shell: bash
        run: |
          set -euo pipefail

          ICON=""

          for CANDIDATE in \
            work/apk/res/Xy.png \
            work/apk/res/7v.png \
            work/apk/assets/icon.png \
            work/apk/assets/splash.png
          do
            if [ -f "$CANDIDATE" ]; then
              ICON="$CANDIDATE"
              break
            fi
          done

          if [ -z "$ICON" ]; then
            BEST_AREA=0

            while IFS= read -r CANDIDATE; do
              W="$(sips -g pixelWidth "$CANDIDATE" 2>/dev/null | awk '/pixelWidth:/ {print $2}' || true)"
              H="$(sips -g pixelHeight "$CANDIDATE" 2>/dev/null | awk '/pixelHeight:/ {print $2}' || true)"

              if [[ "$W" =~ ^[0-9]+$ ]] && [[ "$H" =~ ^[0-9]+$ ]] && [ "$W" -eq "$H" ]; then
                AREA=$((W * H))
                if [ "$AREA" -gt "$BEST_AREA" ]; then
                  BEST_AREA="$AREA"
                  ICON="$CANDIDATE"
                fi
              fi
            done < <(
              find work/apk/res -type f \
                \( -iname '*.png' -o -iname '*.webp' -o -iname '*.jpg' -o -iname '*.jpeg' \) \
                2>/dev/null | sort
            )
          fi

          if [ -z "$ICON" ] || [ ! -f "$ICON" ]; then
            echo "ERROR: launcher icon was not found"
            exit 1
          fi

          echo "$ICON" > output/icon-path.txt
          echo "Using icon: $ICON"
          file "$ICON"
          sips -g pixelWidth -g pixelHeight "$ICON" || true

      - name: Reuse known-good FNAFR iOS runner patches for 1.4.5
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/fnafr145-venv/bin/activate"

          python3 - <<'PYBUILD'
          import os
          import subprocess
          from pathlib import Path

          import yaml

          TARGET_NAME = "FNAFR 3 iOS - v14.6 VERIFIED DIRECT TITLE"


          def run_shell(name, script, check=True):
              print()
              print("=" * 76)
              print("RUNNING:", name)
              print("=" * 76)
              result = subprocess.run(
                  ["/bin/bash", "-c", script],
                  env=os.environ.copy(),
              )
              if check and result.returncode != 0:
                  raise subprocess.CalledProcessError(result.returncode, name)
              return result.returncode


          def find_base_workflow():
              commits = subprocess.check_output(
                  [
                      "git", "log", "--all", "--format=%H", "--",
                      ".github/workflows",
                  ],
                  text=True,
              ).splitlines()

              checked = set()

              for commit in commits:
                  paths = subprocess.check_output(
                      [
                          "git", "ls-tree", "-r", "--name-only", commit,
                          ".github/workflows",
                      ],
                      text=True,
                  ).splitlines()

                  for path in paths:
                      if not path.endswith((".yml", ".yaml")):
                          continue

                      key = (commit, path)
                      if key in checked:
                          continue
                      checked.add(key)

                      try:
                          text = subprocess.check_output(
                              ["git", "show", f"{commit}:{path}"],
                              text=True,
                              stderr=subprocess.DEVNULL,
                          )
                      except subprocess.CalledProcessError:
                          continue

                      if TARGET_NAME not in text:
                          continue

                      data = yaml.safe_load(text)
                      print("Found base workflow:", commit, path)
                      Path("output/base-workflow.txt").write_text(
                          f"{commit} {path}\n",
                          encoding="utf-8",
                      )
                      return data

              raise SystemExit(
                  "ERROR: old v14.6 FNAFR workflow was not found in git history"
              )


          workflow = find_base_workflow()
          steps = workflow["jobs"]["build"]["steps"]


          def get_run(name_part):
              needle = name_part.lower()
              for step in steps:
                  name = str(step.get("name", ""))
                  if needle in name.lower() and step.get("run"):
                      print("Using base step:", name)
                      return step["run"]
              raise SystemExit("ERROR: base step not found: " + name_part)


          # 1) Same pinned runner/SDL that our previous iOS build used.
          run_shell(
              "Clone pinned Butterscotch runner and SDL2",
              get_run("Clone pinned Butterscotch runner and SDL2"),
          )

          # 2) GameMaker 2024.2 ROOM parser compatibility.
          run_shell(
              "Patch GameMaker 2024.2 ROOM parser",
              get_run("Patch GameMaker 2024.2 ROOM parser"),
          )

          # 3) External yytex + VM shims + GLES derivative support.
          compat = get_run("external textures + VM builtins")

          # Fix the natural-number sort typo from the old workflow so
          # texture_2 is ordered before texture_10.
          compat = compat.replace(
              're.split(r"(\\\\d+)", path.name.lower())',
              're.split(r"(\\d+)", path.name.lower())',
          )

          compat = compat.replace(
              "FNAFR 3 v14 compatibility",
              "FNAFR 3 Mobile 1.4.5 compatibility",
          )

          run_shell(
              "1.4.5 external textures + VM + GLES compatibility",
              compat,
          )

          # 4) Make sure the new game.droid actually parses before iOS build.
          preflight = get_run("Build CLI preflight and test parser")
          preflight = preflight.replace(
              "output/v14-preflight-",
              "output/1.4.5-preflight-",
          )
          run_shell("1.4.5 parser preflight", preflight)

          # 5) iOS bundle boot/logging. Do NOT carry the old forced
          # direct-TitleScreen workaround into this fresh 1.4.5 build.
          ios_patch = get_run("Patch Butterscotch for iPhone direct boot")
          ios_patch = ios_patch.replace(
              '                  setenv("FNAFR3_DIRECT_TITLE", "1", 1);\n',
              "",
          )
          ios_patch = ios_patch.replace(
              "=== FNAFR3 iOS v14 launch ===",
              "=== FNAFR3 Mobile 1.4.5 iOS clean launch ===",
          )
          run_shell("Patch iPhone bundle boot + runtime log", ios_patch)

          # 6) Configure native arm64 iPhone build.
          run_shell(
              "Configure iOS arm64 build",
              get_run("Configure iOS arm64 build"),
          )

          # 7) Native build. If it fails, extract the useful compiler errors
          # before failing this step so Diagnostics still contain them.
          native = get_run("Build Butterscotch for iPhone")
          rc = run_shell("Build Butterscotch for iPhone", native, check=False)

          if rc != 0:
              try:
                  run_shell(
                      "Extract build errors",
                      get_run("Extract build errors"),
                      check=False,
                  )
              finally:
                  raise SystemExit(f"Native iOS build failed with exit code {rc}")

          # 8) Reuse the known-good IPA packaging, but rename/version it for 1.4.5.
          package = get_run("Package FNAFR 3 unsigned IPA")
          package = package.replace(
              "FNAFR-3-Mobile-iOS-v14.6-VERIFIED-DIRECT-TITLE-UNSIGNED.ipa",
              "FNAFR-3-Mobile-1.4.5-iOS-v1-CLEAN-UNSIGNED.ipa",
          )
          package = package.replace(
              "<string>1.2</string>",
              "<string>1.4.5</string>",
          )
          package = package.replace(
              "<string>14</string>",
              "<string>14501</string>",
          )

          run_shell("Package Frickbear's 3 Mobile 1.4.5 IPA", package)

          ipa = Path("FNAFR-3-Mobile-1.4.5-iOS-v1-CLEAN-UNSIGNED.ipa")
          if not ipa.is_file():
              raise SystemExit("ERROR: final 1.4.5 IPA was not created")

          print()
          print("=" * 76)
          print("SUCCESS:", ipa)
          print(f"Size: {ipa.stat().st_size / 1024 / 1024:.1f} MB")
          print("=" * 76)
          PYBUILD

      - name: Upload Frickbear's 3 Mobile 1.4.5 unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FNAFR-3-Mobile-1.4.5-iOS-v1-CLEAN-UNSIGNED
          path: FNAFR-3-Mobile-1.4.5-iOS-v1-CLEAN-UNSIGNED.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FNAFR-3-Mobile-1.4.5-iOS-v1-Diagnostics
          path: output
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
