name: FNAFR 3 Mobile 1.4.5 iOS - CLEAN PORT v1.4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Frickbear's 3 Mobile 1.4.5 iOS v1.4
    runs-on: macos-14
    timeout-minutes: 90

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake ninja sdl2 pkg-config || true
          rm -rf work output Payload
          mkdir -p work output

      - name: Download Frickbear's 3 Mobile 1.4.5 APK from Releases
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/release

          python3 - <<'PYAPK'
          import json
          import os
          import pathlib
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]

          releases = json.loads(
              subprocess.check_output(
                  ["gh", "api", f"repos/{repo}/releases?per_page=100"],
                  text=True,
              )
          )

          matches = []

          for release in releases:
              for asset in release.get("assets", []):
                  name = asset.get("name", "")
                  lower = name.lower()

                  if lower.endswith(".apk") and "1.4.5" in lower:
                      score = 0

                      if "frick" in lower:
                          score += 10
                      if "fnafr" in lower:
                          score += 5
                      if "mobile" in lower:
                          score += 2
                      if "betatest" in lower:
                          score += 2

                      matches.append((score, release, asset))

          if not matches:
              print("===== RELEASE ASSETS =====")
              for release in releases:
                  for asset in release.get("assets", []):
                      print(release.get("tag_name"), "->", asset.get("name"))

              raise SystemExit(
                  "ERROR: no 1.4.5 APK was found in GitHub Releases"
              )

          matches.sort(key=lambda item: item[0], reverse=True)
          _, release, asset = matches[0]

          print("Using release:", release.get("tag_name"))
          print("Using asset:", asset.get("name"))
          print("Asset bytes:", asset.get("size"))

          out = pathlib.Path("work/release/FNAFR3-1.4.5.apk")

          endpoint = f"repos/{repo}/releases/assets/{asset['id']}"

          with out.open("wb") as fp:
              subprocess.run(
                  [
                      "gh",
                      "api",
                      endpoint,
                      "-H",
                      "Accept: application/octet-stream",
                  ],
                  stdout=fp,
                  check=True,
              )

          if out.stat().st_size < 1024 * 1024:
              raise SystemExit("ERROR: downloaded APK is too small")

          print("Downloaded:", out, out.stat().st_size, "bytes")
          PYAPK

          cp work/release/FNAFR3-1.4.5.apk work/FNAFR3.apk
          ls -lh work/FNAFR3.apk

      - name: Extract and verify Frickbear's 3 Mobile 1.4.5
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/apk
          mkdir -p work/apk
          unzip -oq work/FNAFR3.apk -d work/apk

          test -f work/apk/assets/game.droid

          GAME_SHA="$(shasum -a 256 work/apk/assets/game.droid | awk '{print $1}')"
          EXPECTED_GAME_SHA="7f800beeb260f1052343065e448755e3eb253c762698f3889de136af8e2537a2"

          echo "game.droid SHA256: $GAME_SHA"
          ls -lh work/apk/assets/game.droid

          if [ "$GAME_SHA" != "$EXPECTED_GAME_SHA" ]; then
            echo "ERROR: this is not the exact 1.4.5 Betatest game.droid we checked."
            exit 1
          fi

          python3 - <<'PYDATA'
          from pathlib import Path
          import struct

          p = Path("work/apk/assets/game.droid")
          b = p.read_bytes()

          if not b.startswith(b"FORM"):
              raise SystemExit("ERROR: game.droid is not a GameMaker FORM archive")

          if b[8:12] != b"GEN8":
              raise SystemExit("ERROR: GEN8 chunk is not at the expected position")

          tgin = b.find(b"TGIN")
          if tgin < 0:
              raise SystemExit("ERROR: TGIN chunk not found")

          pos = tgin + 8
          version = struct.unpack_from("<I", b, pos)[0]
          group_count = struct.unpack_from("<I", b, pos + 4)[0]

          print("GameMaker FORM/GEN8 OK")
          print("TGIN version:", version)
          print("Texture group count:", group_count)
          print("game.droid bytes:", len(b))
          PYDATA

          echo "Total external .yytex files in APK:"
          find work/apk/assets -type f -name '*.yytex' | wc -l

      - name: Find original launcher icon
        shell: bash
        run: |
          set -euo pipefail

          ICON=""

          for CANDIDATE in \
            work/apk/res/Xy.png \
            work/apk/res/7v.png \
            work/apk/assets/icon.png \
            work/apk/assets/splash.png
          do
            if [ -f "$CANDIDATE" ]; then
              ICON="$CANDIDATE"
              break
            fi
          done

          if [ -z "$ICON" ]; then
            BEST_AREA=0

            while IFS= read -r CANDIDATE; do
              W="$(sips -g pixelWidth "$CANDIDATE" 2>/dev/null | awk '/pixelWidth:/ {print $2}' || true)"
              H="$(sips -g pixelHeight "$CANDIDATE" 2>/dev/null | awk '/pixelHeight:/ {print $2}' || true)"

              if [[ "$W" =~ ^[0-9]+$ ]] && [[ "$H" =~ ^[0-9]+$ ]] && [ "$W" -eq "$H" ]; then
                AREA=$((W * H))

                if [ "$AREA" -gt "$BEST_AREA" ]; then
                  BEST_AREA="$AREA"
                  ICON="$CANDIDATE"
                fi
              fi
            done < <(
              find work/apk/res -type f \
                \( -iname '*.png' -o -iname '*.webp' -o -iname '*.jpg' -o -iname '*.jpeg' \) \
                2>/dev/null | sort
            )
          fi

          if [ -z "$ICON" ] || [ ! -f "$ICON" ]; then
            echo "ERROR: launcher icon was not found"
            exit 1
          fi

          echo "$ICON" > output/icon-path.txt
          echo "Using icon: $ICON"
          file "$ICON"
          sips -g pixelWidth -g pixelHeight "$ICON" || true

      - name: Clone pinned Butterscotch runner and SDL2
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 --recurse-submodules \
            https://github.com/ButterscotchRunner/Butterscotch.git \
            work/Butterscotch

          git -C work/Butterscotch fetch --depth 1 origin \
            321487c9e4fce061a9b3d59e321a8432dc12c603

          git -C work/Butterscotch checkout --detach \
            321487c9e4fce061a9b3d59e321a8432dc12c603

          git -C work/Butterscotch submodule update --init --recursive --depth 1

          rm -rf work/Butterscotch/vendor/SDL
          git clone --depth 1 --branch release-2.30.12 \
            https://github.com/libsdl-org/SDL.git \
            work/Butterscotch/vendor/SDL

          git -C work/Butterscotch rev-parse HEAD \
            | tee output/butterscotch-commit.txt

      - name: Patch GameMaker 2024.2 ROOM parser
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYROOM'
          from pathlib import Path
          import re

          p = Path("work/Butterscotch/src/data_win.c")
          s = p.read_text(encoding="utf-8")
          start = s.find("parseROOM(")
          if start < 0:
              raise SystemExit("parseROOM() not found")

          tail = s[start:]
          m = re.search(r"\bfound2024_2\s*=\s*false\s*;", tail)
          if not m:
              raise SystemExit("found2024_2=false marker not found")

          a = start + m.start()
          b = start + m.end()
          old = s[a:b]
          new = re.sub(r"false", "true", old, count=1)
          s = s[:a] + new + s[b:]
          p.write_text(s, encoding="utf-8")

          print("PATCHED:", old.strip(), "=>", new.strip())
          PYROOM

      - name: Add 1.4.5 external textures + VM builtins + GLES fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYV14'
          from pathlib import Path
          import struct
          import re

          root = Path("work/Butterscotch")
          assets = Path("work/apk/assets")
          game = assets / "game.droid"
          b = game.read_bytes()

          # ==========================================================
          # EXTERNAL TEXTURE GROUPS (.yytex)
          # ==========================================================

          tgin = b.find(b"TGIN")
          if tgin < 0:
              raise SystemExit("TGIN chunk not found")

          p = tgin + 8
          version = struct.unpack_from("<I", b, p)[0]
          p += 4
          group_count = struct.unpack_from("<I", b, p)[0]
          p += 4

          group_ptrs = struct.unpack_from(
              "<" + ("I" * group_count), b, p
          )

          def cstr(off):
              if off == 0:
                  return ""
              end = b.find(b"\0", off)
              if end < 0:
                  raise SystemExit("unterminated TGIN string")
              return b[off:end].decode("utf-8", "replace")

          mapping = {}

          for gp in group_ptrs:
              (
                  name_ptr,
                  dir_ptr,
                  ext_ptr,
                  load_type,
                  pages_ptr,
                  sprites_ptr,
                  fonts_ptr,
                  tilesets_ptr,
              ) = struct.unpack_from("<8I", b, gp)

              name = cstr(name_ptr)
              directory = cstr(dir_ptr)
              extension = cstr(ext_ptr)

              page_count = struct.unpack_from("<I", b, pages_ptr)[0]
              pages = (
                  struct.unpack_from(
                      "<" + ("I" * page_count),
                      b,
                      pages_ptr + 4,
                  )
                  if page_count
                  else ()
              )

              # GameMaker load_type 2 = external texture group.
              if load_type != 2:
                  continue

              if not directory:
                  raise SystemExit(
                      "External texture group has no directory: " + name
                  )

              group_dir = assets / directory
              candidates = [
                  path
                  for path in group_dir.iterdir()
                  if path.is_file()
                  and path.suffix.lower() == extension.lower()
              ]

              def natural_texture_key(path):
                  parts = re.split(r"(\d+)", path.name.lower())
                  return [
                      int(part) if part.isdigit() else part
                      for part in parts
                  ]

              candidates.sort(key=natural_texture_key)

              print(
                  f"External texture group {name}: "
                  f"directory={directory} expected={page_count} "
                  f"found={len(candidates)}"
              )

              if len(candidates) < page_count:
                  raise SystemExit(
                      f"Texture group {name} ({directory}) expected "
                      f"at least {page_count} files, found {len(candidates)}"
                  )

              for index_in_group, page_id in enumerate(pages):
                  rel = f"{directory}/{candidates[index_in_group].name}"
                  full = assets / rel
                  if not full.is_file():
                      raise SystemExit(
                          f"Missing external texture page {page_id}: {full}"
                      )
                  mapping[page_id] = rel

          print("TGIN version:", version)
          print("External pages:", len(mapping))

          if len(mapping) != 142:
              raise SystemExit(
                  f"Expected 142 external pages, got {len(mapping)}"
              )

          max_slot = max(max(mapping) + 1, 512)
          header = root / "src" / "fnafr_external_textures.h"

          lines = [
              "#ifndef FNAFR_EXTERNAL_TEXTURES_H",
              "#define FNAFR_EXTERNAL_TEXTURES_H",
              "",
              "#include <stdint.h>",
              "",
              f"#define FNAFR_EXTERNAL_TEXTURE_PATH_COUNT {max_slot}u",
              "static const char* FNAFR_EXTERNAL_TEXTURE_PATHS[FNAFR_EXTERNAL_TEXTURE_PATH_COUNT] = {",
          ]

          for page_id in sorted(mapping):
              rel = mapping[page_id].replace("\\", "\\\\").replace('"', '\\"')
              lines.append(f'    [{page_id}] = "{rel}",')

          lines += ["};", "", "#endif", ""]
          header.write_text("\n".join(lines), encoding="utf-8")

          Path("output/v14-external-textures.txt").write_text(
              "\n".join(f"{k}: {mapping[k]}" for k in sorted(mapping)) + "\n",
              encoding="utf-8",
          )

          data_win = root / "src" / "data_win.c"
          s = data_win.read_text(encoding="utf-8")

          include_anchor = '#include "data_win.h"\n'
          if '#include "fnafr_external_textures.h"' not in s:
              if include_anchor not in s:
                  raise SystemExit("data_win.h include anchor missing")
              s = s.replace(
                  include_anchor,
                  include_anchor + '#include "fnafr_external_textures.h"\n',
                  1,
              )

          old = """    if (tex->blobOffset == 0 || tex->blobSize == 0) return;
              if (tex->blobData != nullptr) return;
          """

          if old not in s:
              raise SystemExit("TXTR lazy loader anchor changed")

          new = r'''    /* FNAFR 3: load GameMaker external .yytex page. */
              if (tex->blobOffset == 0) {
                  if (tex->blobData != nullptr && tex->blobSize != 0) return;

                  if (textureId < FNAFR_EXTERNAL_TEXTURE_PATH_COUNT) {
                      const char* rel = FNAFR_EXTERNAL_TEXTURE_PATHS[textureId];

                      if (rel != nullptr) {
                          const char* assetsRoot = getenv("FNAFR3_ASSETS_ROOT");
                          if (assetsRoot == nullptr || assetsRoot[0] == '\0')
                              assetsRoot = "assets";

                          char externalPath[1024];
                          snprintf(
                              externalPath,
                              sizeof(externalPath),
                              "%s/%s",
                              assetsRoot,
                              rel
                          );

                          FILE* external = fopen(externalPath, "rb");

                          if (external != nullptr) {
                              fseek(external, 0, SEEK_END);
                              long size = ftell(external);
                              fseek(external, 0, SEEK_SET);

                              if (size > 0) {
                                  tex->blobData = (uint8_t*)safeMalloc((size_t)size);
                                  size_t got = fread(
                                      tex->blobData,
                                      1,
                                      (size_t)size,
                                      external
                                  );

                                  if (got == (size_t)size) {
                                      tex->blobSize = (uint32_t)size;
                                      tex->mapped = false;
                                      logInfo(
                                          "FNAFR3: external TXTR %u <- %s (%ld bytes)\n",
                                          textureId,
                                          externalPath,
                                          size
                                      );
                                  } else {
                                      free(tex->blobData);
                                      tex->blobData = nullptr;
                                      tex->blobSize = 0;
                                  }
                              }

                              fclose(external);
                          } else {
                              logWarn(
                                  "FNAFR3: external texture missing: %s\n",
                                  externalPath
                              );
                          }
                      }
                  }

                  return;
              }

              if (tex->blobSize == 0) return;
              if (tex->blobData != nullptr) return;
          '''

          s = s.replace(old, new, 1)
          data_win.write_text(s, encoding="utf-8")

          # ==========================================================
          # MISSING GAMEMAKER BUILTINS FROM v13 DEVICE LOG
          # ==========================================================

          vm = root / "src" / "vm_builtins.c"
          s = vm.read_text(encoding="utf-8")

          reg_marker = "// ===[ REGISTRATION ]===\n"
          if reg_marker not in s:
              raise SystemExit("VM registration marker missing")

          shim = r'''
          // ===[ FNAFR 3 iOS v14 COMPATIBILITY SHIMS ]===

          static RValue fnafr_stub_zero(
              MAYBE_UNUSED VMContext* ctx,
              MAYBE_UNUSED RValue* args,
              MAYBE_UNUSED int32_t argCount
          ) {
              return RValue_makeReal(0.0);
          }

          static RValue fnafr_stub_undefined(
              MAYBE_UNUSED VMContext* ctx,
              MAYBE_UNUSED RValue* args,
              MAYBE_UNUSED int32_t argCount
          ) {
              return RValue_makeUndefined();
          }

          static RValue fnafr_builtin_bool(
              MAYBE_UNUSED VMContext* ctx,
              RValue* args,
              int32_t argCount
          ) {
              if (argCount < 1)
                  return RValue_makeBool(false);
              return RValue_makeBool(RValue_toBool(args[0]));
          }

          static RValue fnafr_builtin_json_stringify(
              VMContext* ctx,
              RValue* args,
              int32_t argCount
          ) {
              if (argCount < 1)
                  return RValue_makeOwnedString(safeStrdup("{}"));

              char* value = RValue_toString(args[0], ctx->dataWin);
              return RValue_makeOwnedString(value);
          }

          static RValue fnafr_date_current_datetime(
              MAYBE_UNUSED VMContext* ctx,
              MAYBE_UNUSED RValue* args,
              MAYBE_UNUSED int32_t argCount
          ) {
              return RValue_makeReal((GMLReal)time(nullptr));
          }

          static struct tm fnafr_date_tm(RValue* args, int32_t argCount) {
              time_t t = time(nullptr);
              if (argCount > 0)
                  t = (time_t)RValue_toReal(args[0]);

              struct tm result;
              memset(&result, 0, sizeof(result));
              struct tm* src = localtime(&t);
              if (src != nullptr) result = *src;
              return result;
          }

          static RValue fnafr_date_get_year(
              MAYBE_UNUSED VMContext* ctx,
              RValue* args,
              int32_t argCount
          ) {
              struct tm tmv = fnafr_date_tm(args, argCount);
              return RValue_makeReal((GMLReal)(tmv.tm_year + 1900));
          }

          static RValue fnafr_date_get_month(
              MAYBE_UNUSED VMContext* ctx,
              RValue* args,
              int32_t argCount
          ) {
              struct tm tmv = fnafr_date_tm(args, argCount);
              return RValue_makeReal((GMLReal)(tmv.tm_mon + 1));
          }

          static RValue fnafr_date_get_day(
              MAYBE_UNUSED VMContext* ctx,
              RValue* args,
              int32_t argCount
          ) {
              struct tm tmv = fnafr_date_tm(args, argCount);
              return RValue_makeReal((GMLReal)tmv.tm_mday);
          }

          static RValue fnafr_virtual_key_add(
              MAYBE_UNUSED VMContext* ctx,
              MAYBE_UNUSED RValue* args,
              MAYBE_UNUSED int32_t argCount
          ) {
              static int32_t nextVirtualKey = 1;
              return RValue_makeInt32(nextVirtualKey++);
          }

          '''

          s = s.replace(reg_marker, shim + reg_marker, 1)

          anchor = (
              "    const bool isGMS2 = "
              "DataWin_isVersionAtLeast(ctx->dataWin, 2, 0, 0, 0);\n"
          )

          if anchor not in s:
              raise SystemExit("VM register anchor changed")

          registrations = r'''

              VM_registerBuiltin(ctx, "vertex_format_add_texcoord", fnafr_stub_undefined);
              VM_registerBuiltin(ctx, "audio_bus_create", fnafr_stub_zero);
              VM_registerBuiltin(ctx, "bool", fnafr_builtin_bool);
              VM_registerBuiltin(ctx, "date_current_datetime", fnafr_date_current_datetime);
              VM_registerBuiltin(ctx, "date_get_year", fnafr_date_get_year);
              VM_registerBuiltin(ctx, "date_get_month", fnafr_date_get_month);
              VM_registerBuiltin(ctx, "date_get_day", fnafr_date_get_day);
              VM_registerBuiltin(ctx, "json_stringify", fnafr_builtin_json_stringify);
              VM_registerBuiltin(ctx, "audio_group_set_gain", fnafr_stub_undefined);
              VM_registerBuiltin(ctx, "display_mouse_unlock", fnafr_stub_undefined);
              VM_registerBuiltin(ctx, "gc_enable", fnafr_stub_undefined);
              VM_registerBuiltin(ctx, "display_reset", fnafr_stub_undefined);
              VM_registerBuiltin(ctx, "audio_sound_loop_start", fnafr_stub_undefined);
              VM_registerBuiltin(ctx, "audio_sound_loop_end", fnafr_stub_undefined);
              VM_registerBuiltin(ctx, "audio_sound_loop", fnafr_stub_undefined);
              VM_registerBuiltin(ctx, "np_initdiscord", fnafr_stub_zero);
              VM_registerBuiltin(ctx, "virtual_key_add", fnafr_virtual_key_add);
              VM_registerBuiltin(ctx, "gc_collect", fnafr_stub_undefined);
          '''

          s = s.replace(anchor, anchor + registrations, 1)
          vm.write_text(s, encoding="utf-8")

          # ==========================================================
          # GLES2 STANDARD DERIVATIVES FOR fwidth()
          # ==========================================================

          gl = root / "src" / "gl" / "gl_renderer.c"
          s = gl.read_text(encoding="utf-8")

          # Exact declaration block verified against pinned Butterscotch
          # commit 321487c9e4fce061a9b3d59e321a8432dc12c603.
          small_anchor = (
              "        char* patchedVertexSource = nullptr;\\n"
              "        char* patchedFragmentSource = nullptr;\\n"
              "\\n"
          )

          if small_anchor not in s:
              Path("output/v14.6-gl-renderer-current.c").write_text(
                  s,
                  encoding="utf-8",
              )
              raise SystemExit("verified GL shader declaration block not found")

          derivatives = r'''
              /*
               * GameMaker GLSLES SDF shaders in FNAFR 3 use fwidth().
               * Some start directly with precision mediump float; and have
               * no #version line, so prepend the derivative extension there.
               */
              if (
                  modernGl->isGLES
                  && fragmentShaderSource != nullptr
                  && strstr(fragmentShaderSource, "fwidth") != nullptr
                  && strstr(fragmentShaderSource, "GL_OES_standard_derivatives") == nullptr
              ) {
                  const char* ext =
                      "#extension GL_OES_standard_derivatives : enable\n";
                  const char* newline = strchr(fragmentShaderSource, '\n');
                  bool hasVersion =
                      strncmp(fragmentShaderSource, "#version", 8) == 0;

                  if (hasVersion && newline != nullptr) {
                      size_t firstLen =
                          (size_t)(newline - fragmentShaderSource) + 1;
                      size_t extLen = strlen(ext);
                      size_t restLen = strlen(newline + 1);

                      patchedFragmentSource =
                          (char*)safeMalloc(firstLen + extLen + restLen + 1);

                      memcpy(patchedFragmentSource, fragmentShaderSource, firstLen);
                      memcpy(patchedFragmentSource + firstLen, ext, extLen);
                      memcpy(
                          patchedFragmentSource + firstLen + extLen,
                          newline + 1,
                          restLen + 1
                      );
                  } else {
                      size_t extLen = strlen(ext);
                      size_t srcLen = strlen(fragmentShaderSource);

                      patchedFragmentSource =
                          (char*)safeMalloc(extLen + srcLen + 1);

                      memcpy(patchedFragmentSource, ext, extLen);
                      memcpy(
                          patchedFragmentSource + extLen,
                          fragmentShaderSource,
                          srcLen + 1
                      );
                  }

                  fragmentShaderSource = patchedFragmentSource;
                  logInfo(
                      "FNAFR3: derivatives enabled for %s\n",
                      shdr->name
                  );
              }

          '''

          s = s.replace(small_anchor, small_anchor + derivatives, 1)
          gl.write_text(s, encoding="utf-8")

          Path("output/v14-compat-summary.txt").write_text(
              "FNAFR 3 Mobile 1.4.5 v1.4 compatibility\n"
              f"external_texture_pages={len(mapping)}\n"
              "vm_builtins=patched\n"
              "gles_standard_derivatives=patched\n",
              encoding="utf-8",
          )

          print("1.4.5 v1.4 compatibility patches applied")
          PYV14

      - name: Build CLI preflight and test parser
        shell: bash
        run: |
          set -euo pipefail

          rm -rf work/build-preflight

          cmake \
            -S work/Butterscotch \
            -B work/build-preflight \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPLATFORM=cli \
            -DBACKEND=sdl2 \
            -DAUDIO_BACKEND=miniaudio \
            -DENABLE_WAD17=ON \
            -DENABLE_ASAN=OFF \
            -DENABLE_VM_STUB_LOGS=ON \
            2>&1 | tee output/1.4.5-v1.4-preflight-configure.log

          cmake --build work/build-preflight -j 4 \
            2>&1 | tee output/1.4.5-v1.4-preflight-build.log

          test -x work/build-preflight/butterscotch

          work/build-preflight/butterscotch \
            --print-rooms \
            work/apk/assets/game.droid \
            > output/1.4.5-v1.4-preflight-parser.log 2>&1

          if grep -Fq "BinaryReader: buffer read error" \
            output/1.4.5-v1.4-preflight-parser.log; then
            echo "ERROR: ROOM parser still broken"
            tail -300 output/1.4.5-v1.4-preflight-parser.log
            exit 1
          fi

          tail -120 output/1.4.5-v1.4-preflight-parser.log

      - name: Disassemble WarningScreen Create for diagnostics
        shell: bash
        run: |
          set +e
          work/build-preflight/butterscotch \
            --disassemble gml_Object_oWarningScreen_Create_0 \
            work/apk/assets/game.droid \
            > output/1.4.5-v1.4-warning-create-disasm.log 2>&1
          tail -220 output/1.4.5-v1.4-warning-create-disasm.log || true
          exit 0

      - name: 1.4.5 headless VM smoke test
        shell: bash
        run: |
          set +e
          set -o pipefail

          export FNAFR3_ASSETS_ROOT="$PWD/work/apk/assets"

          timeout 45 \
            work/build-preflight/butterscotch \
            --lazy-rooms \
            --lazy-textures \
            --lazy-audio \
            --headless \
            --exit-at-frame 300 \
            work/apk/assets/game.droid \
            > output/1.4.5-v1.4-headless.log 2>&1

          echo "$?" > output/1.4.5-v1.4-headless-exit.txt

          echo "===== HEADLESS TAIL ====="
          tail -250 output/1.4.5-v1.4-headless.log || true

          echo "===== UNKNOWN FUNCTIONS ====="
          grep -F 'Unknown function' output/1.4.5-v1.4-headless.log \
            | sort -u \
            | tee output/1.4.5-v1.4-unknown-functions.txt \
            || true

          exit 0

      - name: Patch Butterscotch for iPhone clean boot
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYIOS'
          from pathlib import Path
          import re

          root = Path("work/Butterscotch")
          cmake = root / "CMakeLists.txt"
          s = cmake.read_text(encoding="utf-8")

          cli_main = root / "src" / "cli" / "main.c"
          cli = cli_main.read_text(encoding="utf-8")

          main_marker = """int main(int argc, char* argv[]) {
              setbuf(stderr, NULL);
          """

          direct_boot_main = """int main(int argc, char* argv[]) {
              setbuf(stderr, NULL);

              char* fnafr3_ios_argv[6];

              if (argc < 2) {
                  fnafr3_ios_argv[0] = argv[0];
                  fnafr3_ios_argv[1] = "--lazy-rooms";
                  fnafr3_ios_argv[2] = "--lazy-textures";
                  fnafr3_ios_argv[3] = "--lazy-audio";
                  fnafr3_ios_argv[4] = "assets/game.droid";
                  fnafr3_ios_argv[5] = NULL;

                  argv = fnafr3_ios_argv;
                  argc = 5;
              }
          """

          if main_marker not in cli:
              raise SystemExit("CLI main marker changed")

          cli = cli.replace(main_marker, direct_boot_main, 1)
          cli_main.write_text(cli, encoding="utf-8")

          s, n = re.subn(
              r'project\s*\(\s*butterscotch\s+C(?:\s+OBJC)?\s*\)',
              'project(butterscotch C)\n'
              'if(CMAKE_SYSTEM_NAME STREQUAL "iOS")\n'
              '    set(BUTTERSCOTCH_IOS ON)\n'
              'endif()',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit("Could not patch project()")

          sdl_pattern = re.compile(
              r'elseif\s*\(\s*BACKEND\s+STREQUAL\s+"sdl2"\s*\)'
              r'.*?'
              r'(?=elseif\s*\(\s*BACKEND\s+STREQUAL\s+"sdl3"\s*\))',
              re.S,
          )

          sdl_replacement = '''elseif(BACKEND STREQUAL "sdl2")
              add_compile_definitions(USE_SDL2)
              if(BUTTERSCOTCH_IOS)
                  set(SDL_SHARED OFF CACHE BOOL "" FORCE)
                  set(SDL_STATIC ON CACHE BOOL "" FORCE)
                  set(SDL_TEST OFF CACHE BOOL "" FORCE)
                  set(SDL_TESTS OFF CACHE BOOL "" FORCE)
                  set(SDL_DISABLE_INSTALL ON CACHE BOOL "" FORCE)
                  add_subdirectory(vendor/SDL EXCLUDE_FROM_ALL)
                  target_include_directories(
                      butterscotch
                      PRIVATE
                      ${CMAKE_SOURCE_DIR}/vendor/SDL/include
                  )
                  set(BACKEND_LIBRARIES SDL2::SDL2-static SDL2::SDL2main)
              else()
                  find_package(PkgConfig REQUIRED)
                  pkg_check_modules(SDL2 REQUIRED sdl2)
                  target_include_directories(butterscotch PRIVATE ${SDL2_INCLUDE_DIRS})
                  target_link_directories(butterscotch PRIVATE ${SDL2_LIBRARY_DIRS})
                  set(BACKEND_LIBRARIES ${SDL2_LIBRARIES})
              endif()
          '''

          s, n = sdl_pattern.subn(sdl_replacement, s, count=1)
          if n != 1:
              raise SystemExit("Could not patch SDL2 backend")

          audio_marker = 'file(GLOB AUDIO_SOURCES src/audio/miniaudio/*.c)'
          audio_replacement = '''file(GLOB AUDIO_SOURCES src/audio/miniaudio/*.c)
              if(BUTTERSCOTCH_IOS)
                  enable_language(OBJC)
                  foreach(_audio_src IN LISTS AUDIO_SOURCES)
                      if(_audio_src MATCHES "ma_audio_system\\.c$")
                          set_source_files_properties(
                              "${_audio_src}"
                              PROPERTIES LANGUAGE OBJC
                          )
                      endif()
                  endforeach()
              endif()'''

          if audio_marker not in s:
              raise SystemExit("miniaudio marker missing")
          s = s.replace(audio_marker, audio_replacement, 1)

          anchor = 'if(BACKEND STREQUAL "glfw3")'
          pos = s.find(anchor)
          if pos < 0:
              raise SystemExit("CLI backend anchor missing")

          ios_block = r'''
              if(BUTTERSCOTCH_IOS)
                  set(PLATFORM_LIBRARIES
                      ${PLATFORM_LIBRARIES}
                      "-framework OpenGLES"
                      "-framework UIKit"
                      "-framework Foundation"
                      "-framework QuartzCore"
                      "-framework CoreGraphics"
                      "-framework GameController"
                      "-framework AudioToolbox"
                      "-framework AVFoundation"
                      "-framework CoreAudio"
                  )
                  target_sources(
                      butterscotch
                      PRIVATE
                      ${CMAKE_SOURCE_DIR}/ios_bootstrap.c
                  )
              endif()

          '''

          s = s[:pos] + ios_block + s[pos:]
          cmake.write_text(s, encoding="utf-8")

          (root / "ios_bootstrap.c").write_text(r'''
          #include <mach-o/dyld.h>
          #include <fcntl.h>
          #include <limits.h>
          #include <signal.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/stat.h>
          #include <unistd.h>

          static char g_log_path[PATH_MAX];
          static char g_crash_path[PATH_MAX];

          static void make_dir_if_needed(const char *path)
          {
              if (path != NULL && path[0] != '\0')
                  mkdir(path, 0755);
          }

          static void write_crash_signal(int sig)
          {
              int fd = open(
                  g_crash_path,
                  O_WRONLY | O_CREAT | O_APPEND,
                  0644
              );

              if (fd >= 0)
              {
                  char buf[64];
                  int n = snprintf(buf, sizeof(buf), "signal=%d\n", sig);
                  if (n > 0) write(fd, buf, (size_t)n);
                  close(fd);
              }

              signal(sig, SIG_DFL);
              raise(sig);
          }

          __attribute__((constructor))
          static void FNAFR3_DirectBoot(void)
          {
              const char *home = getenv("HOME");

              if (home != NULL)
              {
                  char documents[PATH_MAX];
                  char mods[PATH_MAX];

                  snprintf(documents, sizeof(documents), "%s/Documents", home);
                  snprintf(mods, sizeof(mods), "%s/Documents/Mods", home);
                  snprintf(g_log_path, sizeof(g_log_path), "%s/Documents/FNAFR3-runtime.log", home);
                  snprintf(g_crash_path, sizeof(g_crash_path), "%s/Documents/FNAFR3-crash.txt", home);

                  make_dir_if_needed(documents);
                  make_dir_if_needed(mods);

                  freopen(g_log_path, "a", stdout);
                  freopen(g_log_path, "a", stderr);
                  setvbuf(stdout, NULL, _IONBF, 0);
                  setvbuf(stderr, NULL, _IONBF, 0);

                  fprintf(stderr, "\n=== FNAFR3 Mobile 1.4.5 iOS v1.4 launch ===\n");
                  setenv("FNAFR3_MODS_DIR", mods, 1);
                  setenv("FNAFR3_ASSETS_ROOT", "assets", 1);

                  signal(SIGABRT, write_crash_signal);
                  signal(SIGSEGV, write_crash_signal);
                  signal(SIGBUS,  write_crash_signal);
                  signal(SIGILL,  write_crash_signal);
                  signal(SIGFPE,  write_crash_signal);
              }

              setenv("SDL_RENDER_VSYNC", "1", 1);

              char path[PATH_MAX];
              uint32_t size = (uint32_t)sizeof(path);

              if (_NSGetExecutablePath(path, &size) != 0)
                  return;

              path[sizeof(path) - 1] = '\0';

              char *slash = strrchr(path, '/');
              if (slash != NULL)
              {
                  *slash = '\0';
                  chdir(path);
              }

              fprintf(stderr, "bundle_cwd=%s\n", path);
          }
          ''', encoding="utf-8")

          print("iOS direct-boot patch applied")
          PYIOS

      - name: Configure iOS arm64 build
        shell: bash
        run: |
          set -euo pipefail

          cmake \
            -S work/Butterscotch \
            -B work/build-ios \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DPLATFORM=cli \
            -DBACKEND=sdl2 \
            -DAUDIO_BACKEND=miniaudio \
            -DENABLE_WAD17=ON \
            -DENABLE_LEGACY_GL=OFF \
            -DENABLE_MODERN_GL=ON \
            -DENABLE_ASAN=OFF \
            -DENABLE_VM_GML_PROFILER=OFF \
            -DENABLE_VM_TRACING=OFF \
            -DENABLE_VM_OPCODE_PROFILER=OFF \
            -DENABLE_VM_STUB_LOGS=ON \
            -DENABLE_VM_EXCEPTIONS_LOGS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee output/cmake-configure.log

      - name: Build Butterscotch for iPhone
        id: native_build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail

          cmake \
            --build work/build-ios \
            --config Release \
            --target butterscotch \
            -- -sdk iphoneos \
               CODE_SIGNING_ALLOWED=NO \
               CODE_SIGNING_REQUIRED=NO \
               DEVELOPMENT_TEAM= \
            2>&1 | tee output/build.log

          RC=${PIPESTATUS[0]}
          echo "$RC" > output/build-exit-code.txt
          exit "$RC"

      - name: Extract build errors
        if: always()
        shell: bash
        run: |
          set +e
          grep -E \
            'error:|fatal error:|Undefined symbols|ld: |CMake Error|FAILED:' \
            output/build.log \
            | tail -800 \
            > output/error-summary.txt || true

          cat output/error-summary.txt || true

      - name: Package Frickbear's 3 Mobile 1.4.5 unsigned IPA
        if: steps.native_build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          BIN="$(
            find work/build-ios \
              -type f \
              -name 'butterscotch' \
              -perm -111 \
              | grep -E 'Release|iphoneos' \
              | sed -n '1p'
          )"

          if [ -z "$BIN" ]; then
            echo "ERROR: iOS runner binary not found"
            exit 1
          fi

          APP="$PWD/Payload/FNAFR3.app"
          mkdir -p "$APP"

          cp "$BIN" "$APP/FNAFR3"
          chmod +x "$APP/FNAFR3"
          cp -R work/apk/assets "$APP/assets"

          test -f "$APP/assets/game.droid"
          YYTEX_COUNT="$(find "$APP/assets" -type f -name '*.yytex' | wc -l | tr -d ' ')"
          echo "Packaged yytex files: $YYTEX_COUNT"
          if [ "$YYTEX_COUNT" -lt 142 ]; then
            echo "ERROR: fewer than 142 external texture pages were packaged"
            exit 1
          fi

          find "$APP/assets" -maxdepth 1 -type f \
            \( -iname '*.dll' -o -iname '*.exe' \) \
            -delete || true

          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Frickbear's 3</string>
            <key>CFBundleExecutable</key>
            <string>FNAFR3</string>
            <key>CFBundleIdentifier</key>
            <string>com.frickbears3.ios.port</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Frickbears3</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.4.5</string>
            <key>CFBundleVersion</key>
            <string>14514</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIApplicationSupportsIndirectInputEvents</key>
            <true/>
            <key>UIRequiresFullScreen</key>
            <true/>
            <key>UIFileSharingEnabled</key>
            <true/>
            <key>LSSupportsOpeningDocumentsInPlace</key>
            <true/>
            <key>CADisableMinimumFrameDurationOnPhone</key>
            <true/>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array>
                  <string>Icon-60</string>
                </array>
              </dict>
            </dict>
          </dict>
          </plist>
          PLIST

          ICON="$(cat output/icon-path.txt)"
          sips -z 120 120 "$ICON" --out "$APP/Icon-60@2x.png" >/dev/null
          sips -z 180 180 "$ICON" --out "$APP/Icon-60@3x.png" >/dev/null

          rm -rf "$APP/_CodeSignature"
          rm -f "$APP/embedded.mobileprovision"

          /usr/bin/zip -qry \
            FNAFR-3-Mobile-1.4.5-iOS-v1.4-CLEAN-UNSIGNED.ipa \
            Payload

          ls -lh FNAFR-3-Mobile-1.4.5-iOS-v1.4-CLEAN-UNSIGNED.ipa

      - name: Upload Frickbear's 3 Mobile 1.4.5 unsigned IPA
        if: steps.native_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FNAFR-3-Mobile-1.4.5-iOS-v1.4-CLEAN-UNSIGNED
          path: FNAFR-3-Mobile-1.4.5-iOS-v1.4-CLEAN-UNSIGNED.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FNAFR-3-Mobile-1.4.5-iOS-v1.4-Diagnostics
          path: output
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: Final status
        if: always()
        shell: bash
        run: |
          echo "Native build outcome: ${{ steps.native_build.outcome }}"

          if [ "${{ steps.native_build.outcome }}" != "success" ]; then
            echo "1.4.5 v1.4 build failed. Download Diagnostics."
            exit 1
          fi

          test -f FNAFR-3-Mobile-1.4.5-iOS-v1.4-CLEAN-UNSIGNED.ipa
          echo "SUCCESS: FNAFR-3-Mobile-1.4.5-iOS-v1.4-CLEAN-UNSIGNED.ipa created."
